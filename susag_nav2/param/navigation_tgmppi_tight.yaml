# TIGHT-TIER variant of navigation_tgmppi.yaml for near-limit BARN worlds
# (unscaled / scaled_1.2): 2.5 cm costmaps resolve the thin wet channel,
# 5x5 m local window = sandbox-validated +-2.5 m tgmppi body, narrow yaw
# sampling + low speed for aligned gap threading. Footprints untouched.
amcl:
  ros__parameters:
    use_sim_time: false
    # Gazebo wheel odometry is substantially cleaner than physical skid-steer
    # odometry. Large motion-noise values made AMCL jump map->odom while yawing.
    alpha1: 0.08
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.08
    alpha5: 0.05
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 120
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.12     # was 0.18: update on smaller motion, converge faster in
                            # tight/dynamic spaces where waiting to move 10+ degrees
                            # before the next update is too slow to react
    update_min_d: 0.08     # was 0.12, same reasoning
    z_hit: 0.75            # was 0.9: less confident that every beam should match the
                            # STATIC map, since moving_obstacle_1/2 aren't in it
    z_max: 0.05
    z_rand: 0.20           # was 0.05 (2026-09-13): the actual fix. A moving obstacle's
                            # laser returns don't match the static map at all; with
                            # z_rand this low, AMCL's likelihood-field model treated
                            # every such beam as strong evidence AGAINST the correct
                            # pose, corrupting the estimate (observed live: AMCL vs.
                            # ground-truth Y drifted up to ~0.5m in world_48_dynamic).
                            # Raising z_rand tells the model to expect a chunk of
                            # "doesn't match the map" beams as normal/tolerated rather
                            # than penalized -- the standard Nav2/AMCL fix for
                            # environments with obstacles the localization map doesn't
                            # know about.
    z_short: 0.0
    scan_topic: front_scan   # 2026-09-15: front lidar only, matching the real-robot trials
                             # (no rear lidar on hardware). The merged /scan was measured
                             # accurate (median 1.4 cm vs known walls) -- not a fix, a match.

amcl_map_client:
  ros__parameters:
    use_sim_time: false

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
