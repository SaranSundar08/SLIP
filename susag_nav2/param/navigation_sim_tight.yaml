controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # Goal checker parameters
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # MPPI parameters
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # prune_distance: matched to navigation_tgmppi_tight.yaml (2026-09-15) so both
      # controllers track the same plan extent; see the comment there.
      prune_distance: 10.0

      # --- SLIP MPPI variant selection ---
      mppi_variant: "vanilla"             # vanilla | log | lowpass | biased

      # log-MPPI knobs (ignored unless variant == log)
      lognormal_sigma: 0.2           # std of the log-normal scale; 0.1 ~ vanilla, 0.3+ = heavy tails

      # LP-MPPI knobs (ignored unless variant == lowpass)
      lowpass_cutoff_hz: 2.0
      lowpass_order: 1
      
      # Biased-MPPI knobs
      bias_strength: 0.5             # fraction of the 2000 samples re-centered on the ancillary
      ancillary_type: "braking"      # pursuit | braking (which ancillary to bias toward)
      # -- pursuit ancillary knobs (used when ancillary_type == pursuit) --
      bias_lookahead_dist: 0.6       # pursuit lookahead point distance (m)
      bias_gain: 1.5                 # pursuit heading P-gain (rad/s per rad of error)
      # -- braking/CBF ancillary knobs (used when ancillary_type == braking) --
      brake_gain: 1.5                # obstacle-repulsion steering P-gain (rad/s per rad)
      brake_scan_dist: 0.3           # cost-gradient finite-difference offset (m)

      # # Guided sampling: reserve N batch rows for fixed escape maneuvers (0=off).
      # # Rear-first order: 1-3 = reverse / reverse-left / reverse-right,
      # # 4-5 = pivot L/R, 6-7 = hard arc L/R. Works with any variant.
      # escape_samples: 3              # 3 = the reverse maneuvers (front-blocked escape)

      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.3   # matched to navigation_tgmppi_tight.yaml (2026-09-09) for a fair vanilla-vs-TG-MPPI comparison
      vy_std: 0.2
      wz_std: 0.7   # matched to navigation_tgmppi_tight.yaml
      vx_max: 0.35  # matched to navigation_tgmppi_tight.yaml
      vx_min: -0.35
      vy_max: 0.5
      wz_max: 1.9
      ax_max: 4.0
      ax_min: -3.0
      ay_min: -3.0
      ay_max: 3.0
      az_max: 3.5
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true
      reset_period: 1.0 # (only in Humble)
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 25   # match navigation_tgmppi.yaml so publish cost is equal
        time_step: 2
      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"
        collision_lookahead_time: 2.0
        consider_footprint: false
      AckermannConstraints:
        min_turning_r: 0.2
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0   # matched to navigation_tgmppi_tight.yaml
        threshold_to_consider: 0.5
      # ObstaclesCritic:
      #   enabled: true
      #   cost_power: 1
      #   repulsion_weight: 1.5
      #   critical_weight: 20.0
      #   consider_footprint: false
      #   collision_cost: 10000.0
      #   collision_margin_distance: 0.1
      #   near_goal_distance: 0.5
      #   inflation_radius: 0.55 # (only in Humble)
      #   cost_scaling_factor: 10.0 # (only in Humble)
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0   # matched to navigation_tgmppi_tight.yaml
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0   # matched to navigation_tgmppi_tight.yaml
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      # VelocityDeadbandCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 35.0
      #   deadband_velocities: [0.05, 0.05, 0.05]
      # TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0
      
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      footprint_padding: 0.03
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link

      footprint: "[[0.42, 0.34],
                  [0.42, -0.34],
                  [-0.42, -0.34],
                  [-0.42, 0.34]]"

      resolution: 0.025

      plugins: ["static_layer", "obstacle_layer", "stvl_global", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        enabled: true
        subscribe_to_updates: true
        transform_tolerance: 0.1

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: front_scan   # 2026-09-15: front only, matches trials (rear_scan block kept, unused)
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        combination_method: 1

        front_scan:
          topic: /front_scan
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          inf_is_valid: false

        rear_scan:
          topic: /rear_scan
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          inf_is_valid: false

      stvl_global:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_size: 0.05
        origin_z: 0.0
        track_unknown_space: true
        publish_voxel_map: true
        transform_tolerance: 0.2
        voxel_decay: 3.0
        decay_model: 1
        combination_method: 1
        observation_sources: pointcloud

        pointcloud:
          data_type: PointCloud2
          topic: /susag/depth_camera/points
          marking: true
          clearing: true
          min_z: 0.10
          max_z: 2.0
          obstacle_range: 3.0
          observation_persistence: 0.2
          filter: "voxel"
          voxel_min_points: 0
          clear_after_reading: true
      
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        enabled: true
        subscribe_to_updates: true
        transform_tolerance: 0.1

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.40  # matched to navigation_tgmppi_tight.yaml (2026-09-14)
        cost_scaling_factor: 6.0  # matched to navigation_tgmppi_tight.yaml (2026-09-14)
        inflate_unknown: false
        inflate_around_unknown: true
      always_send_full_costmap: true


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0   # 2026-09-15: was 5.0; fresher moving obstacles for the controller (both tight yamls)
      publish_frequency: 10.0  # 2026-09-15: was 2.0; RViz showed moving obstacles lagging/jumping ~15 cm per frame
      global_frame: odom
      robot_base_frame: base_link
      footprint_padding: 0.02  # matched to navigation_tgmppi_tight.yaml (2026-09-14);
                                # global costmap's footprint_padding (0.03) already matched
      rolling_window: true
      always_send_full_costmap: true   # RViz "No map received" guard: a rolling costmap otherwise sends only updates once its origin stops moving
      width: 5
      height: 5
      resolution: 0.025
      # robot_radius: 0.3 # radius set and used, so no footprint points
      footprint: "[[0.42, 0.34],
                  [0.42, -0.34],
                  [-0.42, -0.34],
                  [-0.42, 0.34]]"
      resolution: 0.025
      plugins: ["obstacle_layer", "stvl_local", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: front_scan   # 2026-09-15: front only, matches trials (rear_scan block kept, unused)
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        combination_method: 1
        front_scan:
          topic: /front_scan
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          inf_is_valid: false
        rear_scan:
          topic: /rear_scan
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          inf_is_valid: false

      stvl_local:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_size: 0.05
        origin_z: 0.0
        track_unknown_space: true
        publish_voxel_map: true
        transform_tolerance: 0.2
        voxel_decay: 3.0           # faster clearing locally
        decay_model: 1             # 0=None, 1=Linear, 2=Exponential
        combination_method: 1
        observation_sources: pointcloud
        pointcloud:
          data_type: PointCloud2
          topic: /susag/depth_camera/points
          marking: true
          clearing: true
          min_z: 0.10
          max_z: 2.0
          obstacle_range: 3.0
          observation_persistence: 0.2
          filter: "voxel"
          voxel_min_points: 0
          clear_after_reading: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.40  # matched to navigation_tgmppi_tight.yaml (2026-09-14)
        cost_scaling_factor: 6.0  # matched to navigation_tgmppi_tight.yaml (2026-09-14)
        inflate_unknown: false
        inflate_around_unknown: true

map_server:
  ros__parameters:
    yaml_filename: "map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
