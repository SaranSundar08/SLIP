# TIGHT-TIER variant of navigation_sim.yaml (MPPI variants fork) for
# near-limit BARN worlds: 2.5 cm costmaps, narrow yaw sampling, low speed.
# Same caps as navigation_tgmppi_tight.yaml for a fair comparison.
amcl:
  ros__parameters:
    use_sim_time: false
    # Matched to navigation_tgmppi_tight.yaml (2026-09-14, was previously
    # silently different -- 0.4/0.2/0.2/0.4/0.2 and max_beams:60 -- an
    # un-fixed gap from the 2026-09-09 matching pass, which only covered
    # MPPI-side params). Gazebo wheel odometry is substantially cleaner
    # than physical skid-steer odometry; large motion-noise values made
    # AMCL jump map->odom while yawing.
    alpha1: 0.08
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.08
    alpha5: 0.05
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 120
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.12     # matched to navigation_tgmppi_tight.yaml (2026-09-14):
                            # was 0.1, same "converge faster in tight/dynamic
                            # spaces" reasoning as the tgmppi yaml's comment
    update_min_d: 0.08     # was 0.1, same reasoning
    z_hit: 0.75            # matched to navigation_tgmppi_tight.yaml (2026-09-14):
                            # the actual dynamic-obstacle AMCL fix -- without this,
                            # vanilla would still suffer the z_rand-corruption bug
                            # tgmppi no longer has, an unfair comparison in any
                            # dynamic-world test
    z_max: 0.05
    z_rand: 0.20            # was 0.05 -- see navigation_tgmppi_tight.yaml's
                            # z_rand comment for the full root-cause explanation
    z_short: 0.0
    scan_topic: front_scan   # 2026-09-15: front lidar only, matching the real-robot trials
                             # (no rear lidar on hardware). The merged /scan was measured
                             # accurate (median 1.4 cm vs known walls) -- not a fix, a match.

amcl_map_client:
  ros__parameters:
    use_sim_time: false

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: false

